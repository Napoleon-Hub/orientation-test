[versions]
# Плагины
agp = "9.1.1"
kspPlugin = "2.3.6"
composeCompiler = "2.3.20"
googleServices = "4.4.4"
firebaseCrashlyticsPlugin = "3.0.7"
hilt = "2.59.2"

# Библиотеки
coreKtx = "1.18.0"
composeBom = "2026.04.01"
activityCompose = "1.13.0"
lottieCompose = "6.7.1"
lifecycle = "2.10.0"
hiltNavigationCompose = "1.3.0"
navigation = "2.9.8"
coroutines = "1.10.2"
firebaseBom = "34.12.0"
workRuntime = "2.11.2"
billing = "8.3.0"
appUpdate = "2.1.0"
review = "2.0.2"
games = "21.0.0"
gson = "2.13.2"
timber = "5.0.1"

yandexMobileAds = "8.0.0"
adsAppLovin = "13.5.1.0"
unityAds = "4.16.5.0"

[libraries]
# Android & Core
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }

# Compose
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
compose-material = { group = "androidx.compose.material", name = "material" }
compose-material-icons = { module = "androidx.compose.material:material-icons-extended" }
compose-runtime-livedata = { group = "androidx.compose.runtime", name = "runtime-livedata" }
lottie-compose = { group = "com.airbnb.android", name = "lottie-compose", version.ref = "lottieCompose" }

# Lifecycle
lifecycle-viewmodel-ktx = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
lifecycle-livedata-ktx = { group = "androidx.lifecycle", name = "lifecycle-livedata-ktx", version.ref = "lifecycle" }

# Hilt & Navigation
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-android-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }
hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "hiltNavigationCompose" }
navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation" }

# Coroutines
coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }

# Firebase
firebase-bom = { group = "com.google.firebase", name = "firebase-bom", version.ref = "firebaseBom" }
firebase-analytics = { group = "com.google.firebase", name = "firebase-analytics" }
firebase-crashlytics = { group = "com.google.firebase", name = "firebase-crashlytics" }
firebase-firestore = { group = "com.google.firebase", name = "firebase-firestore" }
firebase-auth = { group = "com.google.firebase", name = "firebase-auth" }

# Google Play Services
play-app-update-ktx = { group = "com.google.android.play", name = "app-update-ktx", version.ref = "appUpdate" }
play-review = { group = "com.google.android.play", name = "review", version.ref = "review" }
play-review-ktx = { group = "com.google.android.play", name = "review-ktx", version.ref = "review" }
play-games = { group = "com.google.android.gms", name = "play-services-games-v2", version.ref = "games" }

# Billing
billing-ktx = { group = "com.android.billingclient", name = "billing-ktx", version.ref = "billing" }

# Yandex Mobile Ads
yandex-mobile-ads = { group = "com.yandex.android", name = "mobileads", version.ref = "yandexMobileAds" }
yandex-mobile-ads-applovin = { group = "com.yandex.ads.mediation", name = "mobileads-applovin", version.ref = "adsAppLovin" }
yandex-mobile-ads-unityads = { group = "com.yandex.ads.mediation", name = "mobileads-unityads", version.ref = "unityAds" }

# WorkManager
work-runtime = { group = "androidx.work", name = "work-runtime", version.ref = "workRuntime" }

# Gson
gson = { group = "com.google.code.gson", name = "gson", version.ref = "gson" }

# Timber
timber = { module = "com.jakewharton.timber:timber", version.ref = "timber" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-ksp = { id = "com.google.devtools.ksp", version.ref = "kspPlugin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "composeCompiler" }
hilt-android = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
google-services = { id = "com.google.gms.google-services", version.ref = "googleServices" }
firebase-crashlytics = { id = "com.google.firebase.crashlytics", version.ref = "firebaseCrashlyticsPlugin" }
